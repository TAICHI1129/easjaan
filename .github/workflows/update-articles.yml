
name: Update article index

on:
  push:
    paths:
      - "articles/*.html"
      - ".github/workflows/update-articles.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate article data
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import quote

          directory = Path("articles")
          entries = []

          for path in directory.glob("*.html"):
              match = re.fullmatch(r"(\d+)\|(.+)\.html", path.name)
              if not match:
                  continue

              number = int(match.group(1))
              title = match.group(2)
              encoded_name = quote(path.name, safe="!().-_")

              entries.append({
                  "number": number,
                  "title": title,
                  "path": f"../articles/{encoded_name}"
              })

          entries.sort(key=lambda item: item["number"])

          Path("data").mkdir(exist_ok=True)
          output = [
              {"title": item["title"], "path": item["path"]}
              for item in entries
          ]

          Path("data/articles.json").write_text(
              json.dumps(output, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Commit updated article data
        run: |
          if git diff --quiet -- data/articles.json; then
            echo "Article data is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          git commit -m "Update generated article index"
          git push
