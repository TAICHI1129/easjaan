
name: Update article index

on:
  push:
    paths:
      - "articles/*.html"
      - ".github/workflows/update-articles.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-articles:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate article index
        run: |
          python3 <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import quote

          article_dir = Path("articles")
          output_file = Path("data/articles.json")
          output_file.parent.mkdir(parents=True, exist_ok=True)

          pattern = re.compile(r"^(\d+)\|(.+)\.html$")

          articles = []

          for file in article_dir.glob("*.html"):
              match = pattern.match(file.name)

              if not match:
                  continue

              number = int(match.group(1))
              title = match.group(2)

              articles.append({
                  "number": number,
                  "title": title,
                  "path": "./" + quote(file.name, safe="!().-_")
              })

          articles.sort(key=lambda article: (article["number"], article["title"].casefold()))

          output_file.write_text(
              json.dumps(articles, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Commit updated index
        run: |
          git add data/articles.json
          if git diff --cached --quiet; then
            echo "Article index is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update article index"
          git push
